<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>音频字幕播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh; height: 100dvh;
            background: #222;
            background-size: contain; background-position: center; background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; touch-action: manipulation;
            display: flex; justify-content: center; align-items: flex-end;
        }
        #subtitle {
            background: rgba(0,0,0,0.7); color: white;
            padding: 12px 20px; border-radius: 12px;
            font-size: clamp(18px, 5vw, 28px); line-height: 1.4;
            margin-bottom: 20vh; text-align: center; max-width: 90%;
            pointer-events: none; z-index: 5; word-break: break-word;
        }
        audio {
            position: fixed; bottom: env(safe-area-inset-bottom, 10px); left: 50%; transform: translateX(-50%);
            z-index: 10; width: 92%; max-width: 500px; height: 48px;
        }
        audio.hidden { display: none; }

        /* 新增：视频播放器 */
        video {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000;
            object-fit: contain;
            display: none;
        }
        video.active { display: block; }

        #menuBtn {
            position: fixed; top: env(safe-area-inset-top, 20px); left: 15px; z-index: 100;
            background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px; width: 48px; height: 48px; font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        #menuBtn:active { background: rgba(0,0,0,0.8); }
        #sidebar {
            position: fixed; top: 0; left: 0; width: 260px; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 90; transform: translateX(-100%); transition: transform 0.3s ease;
            padding: 80px 15px 20px 15px; display: flex; flex-direction: column; gap: 15px;
            overflow-y: auto; color: white; font-size: 14px;
        }
        #sidebar.open { transform: translateX(0); }
        .sidebar-btn {
            padding: 12px 16px; background: rgba(255,255,255,0.1); color: white;
            border: 1px solid rgba(255,255,255,0.3); border-radius: 25px; cursor: pointer;
            font-size: 16px; white-space: nowrap; text-align: center;
            touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
            transition: background 0.2s;
        }
        .sidebar-btn:active { background: rgba(255,255,255,0.25); }
        #btnToggleWakeLock { background: rgba(255,255,255,0.2); font-weight: bold; }
        #btnToggleWakeLock.enabled { background: rgba(0,200,80,0.4); border-color: rgba(0,200,80,0.7); }
        #btnToggleWakeLock.disabled { background: rgba(200,60,60,0.4); border-color: rgba(200,60,60,0.7); }

        .playlist-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            overflow: hidden;
        }
        .playlist-title {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #playlist {
            display: flex;
            flex-direction: column;
            max-height: 220px;
            overflow-y: auto;
        }
        .playlist-item {
            padding: 8px 12px;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: white;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            word-break: break-all;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .playlist-item:last-child { border-bottom: none; }
        .playlist-item:hover { background: rgba(255,255,255,0.05); }
        .playlist-item.active {
            color: #4caf50;
            font-weight: bold;
            background: rgba(0,200,80,0.15);
        }
        #log {
            background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; font-size: 12px;
            white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto;
            color: #ddd; line-height: 1.5;
        }
        input[type="file"] { display: none; }
        @media (orientation: landscape) {
            #subtitle { margin-bottom: 12vh; font-size: clamp(16px, 4vw, 24px); }
            #sidebar { width: 300px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="menuBtn">☰</div>
    <div id="sidebar">
        <button class="sidebar-btn" id="btnImportAudioSubtitle">🎵 导入音频及字幕</button>
        <button class="sidebar-btn" id="btnImportVideoSubtitle">🎬 导入视频及字幕</button>
        <button class="sidebar-btn" id="btnImportBackground">🖼️ 导入背景图片</button>
        <button class="sidebar-btn" id="btnToggleWakeLock">防熄屏：开</button>

        <div class="playlist-box">
            <div class="playlist-title">播放列表</div>
            <div id="playlist"></div>
        </div>

        <div id="log"></div>
    </div>

    <video id="video" controls playsinline webkit-playsinline></video>
    <audio id="audio" controls playsinline webkit-playsinline></audio>
    <div id="subtitle"></div>

    <input type="file" id="audioSubtitleInput" accept="audio/*,.srt,.vtt,.ass,.ssa,.sub,.txt,.lrc" multiple>
    <input type="file" id="videoSubtitleInput" accept="video/*,.srt,.vtt,.ass,.ssa,.sub,.txt,.lrc" multiple>
    <input type="file" id="backgroundInput" accept="image/*">

    <script>
        (function() {
            const audio = document.getElementById('audio');
            const video = document.getElementById('video');
            const subtitleDiv = document.getElementById('subtitle');
            const logDiv = document.getElementById('log');
            const btnImportAudioSubtitle = document.getElementById('btnImportAudioSubtitle');
            const btnImportVideoSubtitle = document.getElementById('btnImportVideoSubtitle');
            const btnImportBackground = document.getElementById('btnImportBackground');
            const btnToggleWakeLock = document.getElementById('btnToggleWakeLock');
            const audioSubtitleInput = document.getElementById('audioSubtitleInput');
            const videoSubtitleInput = document.getElementById('videoSubtitleInput');
            const backgroundInput = document.getElementById('backgroundInput');
            const menuBtn = document.getElementById('menuBtn');
            const sidebar = document.getElementById('sidebar');
            const playlistDiv = document.getElementById('playlist');

            let playlist = [];
            let currentIndex = 0;
            let currentSubtitles = [];
            let currentObjectUrl = null;
            let currentMediaName = '';
            let wakeLockEnabled = true;
            let wakeLock = null;
            let backgroundObjectUrl = null;

            const audioExts = ['mp3','wav','m4a','ogg','flac','aac','opus','wma'];
            const videoExts = ['mp4','webm','mkv','mov','avi','m4v','ogv','3gp','flv','wmv'];
            const subtitleExts = ['srt','vtt','ass','ssa','sub','txt','lrc'];

            function log(msg) { console.log(msg); logDiv.textContent = msg; }

            // ---------- 时间解析（通用） ----------
            function parseTime(str) {
                const parts = str.split(':');
                if (parts.length === 3) return parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseFloat(parts[2].replace(',','.'));
                else if (parts.length === 2) return parseInt(parts[0])*60 + parseFloat(parts[1].replace(',','.'));
                return NaN;
            }

            // ---------- SRT / VTT 解析 ----------
            function parseSRT(text) {
                const normalized = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
                const blocks = normalized.trim().split(/\n\s*\n/);
                const result = [];
                for (const block of blocks) {
                    const lines = block.split('\n');
                    if (lines.length < 2) continue;
                    const timeIndex = lines.findIndex(l => l.includes('-->'));
                    if (timeIndex === -1) continue;
                    const [startStr, endStr] = lines[timeIndex].split('-->').map(t => t.trim());
                    const start = parseTime(startStr.split(/\s+/)[0]);
                    const end = parseTime(endStr.split(/\s+/)[0]);
                    if (isNaN(start) || isNaN(end)) continue;
                    const text = lines.slice(timeIndex+1).join(' ').replace(/<[^>]*>/g,'').trim();
                    if (text) result.push({start,end,text});
                }
                return result;
            }

            // ---------- LRC 解析 ----------
            function parseLRC(text) {
                const normalized = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
                const lines = normalized.split('\n');
                const entries = [];
                const timeTagRegex = /\[(\d{1,2}:\d{1,2}(?:[.:]\d{1,3})?)\]/g;

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    const tags = [];
                    let match;
                    while ((match = timeTagRegex.exec(line)) !== null) {
                        const start = parseTime(match[1]);
                        if (!isNaN(start)) tags.push({ start });
                    }
                    if (tags.length === 0) continue;

                    const text = line.replace(timeTagRegex, '').trim();
                    if (!text) continue;

                    for (const tag of tags) entries.push({ start: tag.start, text });
                }

                entries.sort((a, b) => a.start - b.start);
                for (let i = 0; i < entries.length; i++) {
                    entries[i].end = i < entries.length - 1 ? entries[i + 1].start : entries[i].start + 5;
                }
                return entries;
            }

            function parseSubtitleFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const text = reader.result;
                        const ext = file.name.split('.').pop().toLowerCase();
                        if (ext === 'lrc') {
                            resolve(parseLRC(text));
                        } else {
                            const srtResult = parseSRT(text);
                            if (srtResult.length === 0 && /\[(\d{1,2}:\d{1,2}(?:[.:]\d{1,3})?)\]/.test(text)) {
                                resolve(parseLRC(text));
                            } else {
                                resolve(srtResult);
                            }
                        }
                    };
                    reader.onerror = reject;
                    reader.readAsText(file, 'UTF-8');
                });
            }

            // ---------- 获取当前活动的播放器 ----------
            function getActivePlayer() {
                return video.classList.contains('active') ? video : audio;
            }

            // ---------- 加载指定曲目 ----------
            function loadTrack(index) {
                if (index < 0 || index >= playlist.length) return;
                currentIndex = index;
                const track = playlist[index];
                if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = URL.createObjectURL(track.mediaFile);

                const isVideo = track.type === 'video';

                // 切换显示
                video.classList.toggle('active', isVideo);
                audio.classList.toggle('hidden', isVideo);

                // 暂停并清空另一个播放器
                if (isVideo) {
                    audio.pause();
                    audio.removeAttribute('src');
                    audio.load();
                } else {
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                }

                const player = isVideo ? video : audio;
                player.src = currentObjectUrl;
                currentSubtitles = track.subtitles;
                currentMediaName = track.mediaName;
                subtitleDiv.textContent = '';
                player.play().catch(() => {});
                updatePlaylistHighlight();
                log(`正在播放：${track.mediaName}（${isVideo ? '🎬 视频' : '🎵 音频'}）`);
            }

            function updatePlaylistHighlight() {
                document.querySelectorAll('.playlist-item').forEach((el, i) => {
                    el.classList.toggle('active', i === currentIndex);
                });
            }

            function renderPlaylist() {
                playlistDiv.innerHTML = '';
                playlist.forEach((track, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'playlist-item';
                    btn.textContent = `${index + 1}. ${track.type === 'video' ? '🎬' : '🎵'} ${track.mediaName}`;
                    btn.addEventListener('click', () => {
                        if (index !== currentIndex) {
                            loadTrack(index);
                        } else {
                            const p = getActivePlayer();
                            if (p.paused) p.play();
                        }
                    });
                    playlistDiv.appendChild(btn);
                });
                updatePlaylistHighlight();
            }

            // ---------- 导入文件（音频 + 视频 + 字幕 统一处理） ----------
            async function handleFiles(files) {
                const mediaFiles = [];
                const subtitleFiles = [];

                for (const file of files) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (audioExts.includes(ext) || videoExts.includes(ext)) mediaFiles.push(file);
                    else if (subtitleExts.includes(ext)) subtitleFiles.push(file);
                }

                if (mediaFiles.length === 0) {
                    log('❌ 未找到媒体文件');
                    alert('请选择至少一个音频或视频文件');
                    return;
                }

                mediaFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
                subtitleFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

                const newPlaylist = [];
                const minCount = Math.max(mediaFiles.length, subtitleFiles.length);
                for (let i = 0; i < minCount; i++) {
                    const mediaFile = mediaFiles[i];
                    if (!mediaFile) continue;
                    const ext = mediaFile.name.split('.').pop().toLowerCase();
                    newPlaylist.push({
                        mediaFile,
                        mediaName: mediaFile.name.replace(/\.[^/.]+$/, ''),
                        type: videoExts.includes(ext) ? 'video' : 'audio',
                        subtitleFile: subtitleFiles[i] || null,
                        subtitles: []
                    });
                }

                await Promise.all(newPlaylist.map(async (item) => {
                    if (item.subtitleFile) {
                        try {
                            item.subtitles = await parseSubtitleFile(item.subtitleFile);
                        } catch (e) {
                            console.warn('字幕解析失败：' + item.subtitleFile.name);
                        }
                    }
                }));

                playlist = newPlaylist;
                currentIndex = 0;
                renderPlaylist();
                loadTrack(0);

                const videoCount = newPlaylist.filter(t => t.type === 'video').length;
                const audioCount = newPlaylist.length - videoCount;
                log(`已导入：🎵 音频 ${audioCount} 个，🎬 视频 ${videoCount} 个，字幕 ${subtitleFiles.length} 个`);
            }

            function setBackground(file) {
                if (backgroundObjectUrl) URL.revokeObjectURL(backgroundObjectUrl);
                backgroundObjectUrl = URL.createObjectURL(file);
                document.body.style.backgroundImage = `url(${backgroundObjectUrl})`;
                log(`背景已更换：${file.name}`);
            }

            // ---------- 字幕同步 / 播完切歌 ----------
            function updateSubtitle() {
                if (!currentSubtitles.length) {
                    subtitleDiv.textContent = '';
                    return;
                }
                const t = getActivePlayer().currentTime;
                const s = currentSubtitles.find(s => t >= s.start && t < s.end);
                subtitleDiv.textContent = s ? s.text : '';
            }

            function onEnded() {
                if (currentIndex < playlist.length - 1) {
                    loadTrack(currentIndex + 1);
                } else {
                    subtitleDiv.textContent = '';
                }
            }

            function bindMediaEvents(el) {
                el.addEventListener('timeupdate', updateSubtitle);
                el.addEventListener('ended', onEnded);
                el.addEventListener('play', updateMediaSession);
                el.addEventListener('loadedmetadata', updateMediaSession);
            }
            bindMediaEvents(audio);
            bindMediaEvents(video);

            // ---------- 锁屏 / 媒体控制 ----------
            function updateMediaSession() {
                if ('mediaSession' in navigator && currentMediaName) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: currentMediaName,
                        artist: '音频字幕播放器'
                    });
                }
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => getActivePlayer().play());
                navigator.mediaSession.setActionHandler('pause', () => getActivePlayer().pause());
            }

            // ---------- Wake Lock ----------
            async function requestWakeLock() {
                if (!('wakeLock' in navigator)) {
                    log('当前浏览器不支持防熄屏（Wake Lock）');
                    return;
                }
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                    log('防熄屏已开启');
                } catch (err) {
                    log(`获取屏幕唤醒锁失败: ${err.message}`);
                }
            }

            function releaseWakeLock() {
                if (wakeLock) {
                    wakeLock.release().then(() => { wakeLock = null; log('防熄屏已关闭'); });
                }
            }

            function updateWakeLockBtn() {
                btnToggleWakeLock.textContent = `防熄屏：${wakeLockEnabled ? '开' : '关'}`;
                btnToggleWakeLock.classList.toggle('enabled', wakeLockEnabled);
                btnToggleWakeLock.classList.toggle('disabled', !wakeLockEnabled);
            }

            btnToggleWakeLock.addEventListener('click', () => {
                wakeLockEnabled = !wakeLockEnabled;
                updateWakeLockBtn();
                if (wakeLockEnabled) requestWakeLock();
                else releaseWakeLock();
            });

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && wakeLockEnabled && !wakeLock) requestWakeLock();
            });

            updateWakeLockBtn();
            requestWakeLock();

            // ---------- UI 交互 ----------
            menuBtn.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.toggle('open'); });
            document.addEventListener('click', (e) => {
                if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) sidebar.classList.remove('open');
            });

            btnImportAudioSubtitle.addEventListener('click', () => { audioSubtitleInput.click(); sidebar.classList.remove('open'); });
            btnImportVideoSubtitle.addEventListener('click', () => { videoSubtitleInput.click(); sidebar.classList.remove('open'); });
            btnImportBackground.addEventListener('click', () => { backgroundInput.click(); sidebar.classList.remove('open'); });

            audioSubtitleInput.addEventListener('change', (e) => { if (e.target.files.length) handleFiles(e.target.files); e.target.value=''; });
            videoSubtitleInput.addEventListener('change', (e) => { if (e.target.files.length) handleFiles(e.target.files); e.target.value=''; });
            backgroundInput.addEventListener('change', (e) => { if (e.target.files[0]) setBackground(e.target.files[0]); e.target.value=''; });

            log('点击左上角展开侧边栏');
        })();
    </script>
</body>
</html>
